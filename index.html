<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweeTec</title>
    <script defer src="login.js"></script>  
    <link rel="shortcut icon" href="uploads/SweeTec (1).png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="jquery.js"></script>
</head>
<body>
    <header>
        <nav>
            <span class="logo">
                <img tabindex="0" src="uploads/SweeTec (1).png" title="SweeTec Logo" id="logo" onkeydown="if(event.key==='Enter') refresh()" onclick="refresh()" >
            </span>
            <span class="searchSpan"><i onclick="search()" class="fa-solid fa-magnifying-glass white"></i>
                <input type="text" id="Procurar" class="inputSpan" placeholder="Search...">
            </span>
        </nav>
    </header>
<br> 
<br>
<br>
    <main>
        <section id="barra-lateral">

            <a tabindex="0" onclick="refresh()" onkeydown="if(event.key==='Enter') refresh()" class="botao-lateral">
                <span >
                <i class="fa-solid fa-bars"></i> Inicio
                </span>   
            </a>

            <a tabindex="0" onclick="vender()" onkeydown="if(event.key==='Enter') vender()" class="botao-lateral">
                <span>
                <i class="fa-solid fa-cart-shopping"></i> Anunciar
                </span>   
            </a>

            <a tabindex="0" class="botao-lateral" onkeydown="if(event.key==='Enter') produtosUser()" onclick="produtosUser()">
                <span>
                    <i class="fa-solid fa-folder"></i> Meus produtos
                </span>
            </a>
            
            <a tabindex="0" class="botao-lateral" id="abrirModal" onkeydown="if(event.key==='Enter') conta()" onclick="conta()">
                <span>
                    <i class="fa-solid fa-user"></i> Conta
                </span>
            </a>

            <a tabindex="0" class="botao-lateral" onkeydown="if(event.key==='Enter') sair()" onclick="sair()">
                <span>
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </span>
            </a>

        </section>

        <section id="cardContainer">

        </section>

        <section class="modal-overlay">
            <div class="modal">

            </div>
        </section>
    </main>

    <span id="tudo">
        <span id="barra-lateral2"></span>
        <span id="cardContainer2"></span>
    </span>


    
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>
</html>
