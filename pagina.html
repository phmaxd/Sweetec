<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina</title>
    <script defer src="login.js"></script>  
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="jquery.js"></script>
</head>
<body>
    <header>
        <nav>
            <span class="logo">
                <img src="imagens/SweeTec (1).png" id="logo" onclick="refresh()" >
            </span>
            <span class="searchSpan"><i onclick="search()" class="fa-solid fa-magnifying-glass white"></i>
                <input type="text" id="Procurar" class="inputSpan" placeholder="Search...">
            </span>
        </nav>
    </header>
<br> 
<br>
<br>
    <main>
        <section id="barra-lateral">

            <a onclick="refresh()" class="botao-lateral">
                <span >
                <i class="fa-solid fa-bars"></i> Inicio
                </span>   
            </a>

            <a onclick="vender()"class="botao-lateral">
                <span>
                <i class="fa-solid fa-cart-shopping"></i> Anunciar
                </span>   
            </a>

            <a class="botao-lateral" onclick="produtosUser()">
                <span>
                    <i class="fa-solid fa-folder"></i> Meus produtos
                </span>
            </a>
            
            <a class="botao-lateral" id="abrirCamera" onclick="conta()">
                <span>
                    <i class="fa-solid fa-user"></i> Conta
                </span>
            </a>

            <a class="botao-lateral" onclick="sair()">
                <span>
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </span>
            </a>

        </section>

        <section id="cardContainer">

        </section>

        <section class="modal-overlay">
            <div class="modal">

            </div>
        </section>
    </main>

    <span id="tudo">
        <span id="barra-lateral2"></span>
        <span id="cardContainer2"></span>
    </span>
</body>
</html>
